    // Creating the main App component
    function App() {
      const [urns, setUrns] = React.useState(initialUrns);
      const [selectedUrnIndex, setSelectedUrnIndex] = React.useState(null);
      const [desiredMarginPct, setDesiredMarginPct] = React.useState(60); // Default to target 60% margin

      // Handling margin percentage input change
      const handleMarginChange = (e) => {
        const value = parseFloat(e.target.value);
        if (!isNaN(value) && value >= 0 && value <= 100 && selectedUrnIndex !== null) {
          setDesiredMarginPct(value);
          // Updating only the selected urn
          const updatedUrns = urns.map((urn, index) => {
            if (index === selectedUrnIndex) {
              const desiredMarginDecimal = value / 100;
              // Retail = Wholesale Price / (1 - Desired Margin %)
              const newRetail = desiredMarginDecimal < 1 ? urn.wsPrice / (1 - desiredMarginDecimal) : urn.wsPrice * 2; // Prevent division by zero
              const newMargin = newRetail - urn.wsPrice;
              return { ...urn, currentPrice: Math.round(newRetail * 100) / 100, margin: Math.round(newMargin * 100) / 100 };
            }
            return urn;
          });
          setUrns(updatedUrns);
        }
      };

      // Handling urn selection
      const handleUrnSelect = (index) => {
        setSelectedUrnIndex(index);
        // Reset margin to the selected urn's current margin
        const selectedUrn = urns[index];
        const currentMarginPct = ((selectedUrn.currentPrice - selectedUrn.wsPrice) / selectedUrn.currentPrice) * 100;
        setDesiredMarginPct(currentMarginPct);
      };

      // Rendering the UI
      return (
        <div className="container mx-auto p-6">
          <h1 className="text-3xl font-bold mb-6 text-center text-gray-800">Urn Pricing Tool</h1>

          {/* Current Urn Pricing Table */}
          <h2 className="text-2xl font-semibold mb-4 text-gray-700">Current Urn Pricing</h2>
          <div className="overflow-x-auto mb-12">
            <table className="min-w-full bg-white border rounded-lg shadow-lg">
              <thead>
                <tr className="bg-gray-600 text-white">
                  <th className="p-3 text-left">Material</th>
                  <th className="p-3 text-left">Urn Name</th>
                  <th className="p-3 text-right">Wholesale Price ($)</th>
                  <th className="p-3 text-right">Current Multiplier</th>
                  <th className="p-3 text-right">Current Price ($)</th>
                  <th className="p-3 text-right">Current Margin (%)</th>
                </tr>
              </thead>
              <tbody>
                {initialUrns.map((urn, index) => (
                  <tr key={index} className={index % 2 === 0 ? 'bg-gray-50' : 'bg-white'}>
                    <td className="p-3">{urn.material}</td>
                    <td className="p-3">{urn.name}</td>
                    <td className="p-3 text-right">{urn.wsPrice.toFixed(2)}</td>
                    <td className="p-3 text-right">{urn.currentMultiplier.toFixed(4)}</td>
                    <td className="p-3 text-right font-semibold">{urn.currentPrice.toFixed(2)}</td>
                    <td className="p-3 text-right">{((urn.currentPrice - urn.wsPrice) / urn.currentPrice * 100).toFixed(2)}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Interactive Pricing Adjuster Table */}
          <h2 className="text-2xl font-semibold mb-4 text-gray-700">Adjustable Urn Pricing (Single Urn)</h2>
          <div className="mb-6 flex justify-center items-center">
            <label className="mr-4 text-lg text-gray-700 flex items-center">
              Desired Margin (%):
              <input
                type="range"
                min="0"
                max="100"
                step="0.1"
                value={desiredMarginPct}
                onChange={handleMarginChange}
                className="ml-2 w-48"
                disabled={selectedUrnIndex === null}
              />
              <span className="ml-2">{desiredMarginPct.toFixed(1)}%</span>
            </label>
            <input
              type="number"
              value={desiredMarginPct}
              onChange={handleMarginChange}
              className="p-2 border rounded w-24"
              min="0"
              max="100"
              step="0.1"
              disabled={selectedUrnIndex === null}
            />
          </div>
          <div className="overflow-x-auto">
            <table className="min-w-full bg-white border rounded-lg shadow-lg">
              <thead>
                <tr className="bg-blue-600 text-white">
                  <th className="p-3 text-center">Select</th>
                  <th className="p-3 text-left">Material</th>
                  <th className="p-3 text-left">Urn Name</th>
                  <th className="p-3 text-right">Wholesale Price ($)</th>
                  <th className="p-3 text-right">Current Multiplier</th>
                  <th className="p-3 text-right">Current Price ($)</th>
                  <th className="p-3 text-right">Current Margin (%)</th>
                </tr>
              </thead>
              <tbody>
                {urns.map((urn, index) => (
                  <tr
                    key={index}
                    className={`${index % 2 === 0 ? 'bg-gray-50' : 'bg-white'} ${selectedUrnIndex === index ? 'bg-blue-100' : ''}`}
                  >
                    <td className="p-3 text-center">
                      <input
                        type="radio"
                        name="urnSelect"
                        checked={selectedUrnIndex === index}
                        onChange={() => handleUrnSelect(index)}
                      />
                    </td>
                    <td className="p-3">{urn.material}</td>
                    <td className="p-3">{urn.name}</td>
                    <td className="p-3 text-right">{urn.wsPrice.toFixed(2)}</td>
                    <td className="p-3 text-right">{urn.currentMultiplier.toFixed(4)}</td>
                    <td className="p-3 text-right font-semibold">{urn.currentPrice.toFixed(2)}</td>
                    <td className="p-3 text-right">{((urn.currentPrice - urn.wsPrice) / urn.currentPrice * 100).toFixed(2)}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {selectedUrnIndex === null && (
            <p className="mt-4 text-center text-gray-600">Please select an urn to adjust its margin.</p>
          )}
        </div>
      );
    }

    // Rendering the App component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
